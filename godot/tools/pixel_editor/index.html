<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CyberLearn Pixel Forge</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
	<header>
		<h1>PIXEL FORGE</h1>
		<div class="header-actions">
			<label>Canvas
				<select id="gridSizeSelect">
					<option value="16">16x16</option>
					<option value="32" selected>32x32</option>
					<option value="48">48x48</option>
					<option value="64">64x64</option>
				</select>
			</label>
			<button id="newCanvasBtn">New</button>
		</div>
	</header>

	<div class="workspace">
		<aside class="tools">
			<div class="tool-group">
				<button class="tool-btn active" data-tool="pencil" title="Pencil (P)">✏️</button>
				<button class="tool-btn" data-tool="eraser" title="Eraser (E)">🧽</button>
				<button class="tool-btn" data-tool="fill" title="Bucket Fill (F)">🪣</button>
				<button class="tool-btn" data-tool="eyedropper" title="Eyedropper (I)">💧</button>
				<button class="tool-btn" data-tool="line" title="Line (L)">📏</button>
			</div>

			<div class="tool-group">
				<label class="checkbox-row"><input type="checkbox" id="mirrorX" /> Mirror X</label>
				<label class="checkbox-row"><input type="checkbox" id="showGrid" checked /> Grid lines</label>
			</div>

			<div class="tool-group">
				<button id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button>
				<button id="redoBtn" title="Redo (Ctrl+Y)">↷ Redo</button>
			</div>

			<div class="tool-group zoom-group">
				<button id="zoomOutBtn">－</button>
				<span id="zoomLabel">16px</span>
				<button id="zoomInBtn">＋</button>
			</div>
		</aside>

		<main class="canvas-area">
			<div id="canvasWrap">
				<canvas id="checkerCanvas"></canvas>
				<canvas id="pixelCanvas"></canvas>
				<canvas id="gridCanvas"></canvas>
			</div>
		</main>

		<aside class="right-panel">
			<section class="panel">
				<h2>Palette</h2>
				<div class="current-color-row">
					<input type="color" id="colorPicker" value="#6c5ce7" />
					<button id="clearAlphaBtn" title="Set current tool to erase">Eraser color: transparent</button>
				</div>
				<div id="swatches" class="swatches"></div>
			</section>

			<section class="panel">
				<h2>File</h2>
				<label class="field-row">Category
					<select id="categorySelect">
						<option value="sprites">sprites</option>
						<option value="tiles">tiles</option>
					</select>
				</label>
				<label class="field-row">Filename
					<input type="text" id="filenameInput" value="new_sprite.png" />
				</label>
				<div class="btn-row">
					<button id="importBtn">Import PNG</button>
					<input type="file" id="importFile" accept="image/png" hidden />
					<button id="downloadBtn">Download PNG</button>
				</div>
				<label class="field-row">Export scale
					<select id="exportScaleSelect">
						<option value="1">1x</option>
						<option value="2" selected>2x</option>
						<option value="4">4x</option>
					</select>
				</label>
				<button id="saveToProjectBtn" class="primary-btn">Save to project</button>
				<p id="fileStatus" class="status-line"></p>
			</section>

			<section class="panel">
				<h2>AI Seed</h2>
				<textarea id="aiPrompt" rows="3" placeholder="e.g. top-down pixel art vendor NPC, teal apron, cyberpunk market stall"></textarea>
				<button id="aiGenerateBtn" class="primary-btn">Generate seed</button>
				<p class="hint">Generates a starting image via the local server's configured AI provider, then quantizes it down to this canvas's grid so you can refine it pixel by pixel.</p>
				<p id="aiStatus" class="status-line"></p>
			</section>
		</aside>
	</div>
</div>
<script src="editor.js"></script>
</body>
</html>
